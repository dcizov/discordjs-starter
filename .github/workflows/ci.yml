name: Orbit CI
on:
  push:
    branches: [main, "arena/**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: orbit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: orbit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orbit -d orbit_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEMO_MODE: "true"
      TEST_DATABASE_URL: postgres://orbit:test_password@localhost:5432/orbit_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Screenshots are review material, not assertions: this spec always runs
      # when VISUAL_EVIDENCE=1 and the artifact is kept on success too, so a
      # reviewer can inspect the dashboard without a local browser.
      - run: npx playwright test tests/e2e/screenshots.spec.ts
        env:
          VISUAL_EVIDENCE: "1"
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-screenshots
          path: visual-evidence/
          if-no-files-found: ignore
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Test plugin artifact integrity/packaging installer offline
        run: python3 -m unittest discover -s docker/lavalink -p 'test_*.py'
      - name: Validate full-stack and headless development Compose profiles
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile live --profile music config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile live config --quiet
      - run: docker build --target runtime -t orbit:ci .
      - run: docker build --target dev -t orbit:ci-dev .
      - name: Smoke-test unprivileged development image without network access
        run: |
          docker run --rm --network none --entrypoint sh orbit:ci-dev -c '
            node -e "const fs=require(\"node:fs\"); if(process.getuid()===0) throw Error(\"Development must not run as root\"); for(const p of [\"/app/.data\",\"/app/apps/web/.next\",\"/app/node_modules\"]) fs.accessSync(p,fs.constants.W_OK)" &&
            npm run roles:export -- --help &&
            npm run music:doctor -- --help
          '
      - name: Build all pinned music plugins and run offline Soundy unit tests
        run: |
          set -o pipefail
          if docker build --progress=plain -f docker/lavalink/Dockerfile -t orbit:lavalink-ci . 2>&1 | tee "$RUNNER_TEMP/lavalink-build.log"; then
            exit 0
          fi
          # Keep the failure readable through the Checks API when the Actions
          # log-download CDN is unavailable. Only this credential-free build.
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          text = Path(os.environ["RUNNER_TEMP"], "lavalink-build.log").read_text(errors="replace")
          tail = "\n".join(text.splitlines()[-80:])[-16000:]
          for index, offset in enumerate(range(0, len(tail), 3000), 1):
              escaped = tail[offset:offset + 3000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Pinned music backend build failed {index}::{escaped}")
          PYTHON
          exit 1
      - name: Inspect image-owned Lavalink readiness contract
        run: |
          docker image inspect --format '{{json .Config.Healthcheck}}' orbit:lavalink-ci > "$RUNNER_TEMP/lavalink-healthcheck.json"
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import fs from "node:fs";
            const health = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/lavalink-healthcheck.json", "utf8"));
            assert.deepEqual(health.Test, ["CMD", "/opt/Lavalink/healthcheck/run"]);
            assert.equal(health.Interval, 5000000000);
            assert.equal(health.Timeout, 5000000000);
            assert.equal(health.StartPeriod, 20000000000);
            assert.equal(health.Retries, 12);
          '
          # Inspect the actual final image instead of assuming curl/wget is present.
          tools="$(docker run --rm --network none --entrypoint sh orbit:lavalink-ci -c 'for tool in java curl wget node python; do if command -v "$tool" >/dev/null 2>&1; then printf "%s=yes " "$tool"; else printf "%s=no " "$tool"; fi; done')"
          printf '::notice title=Lavalink runtime tool inventory::%s\n' "$tools"
      - name: Exercise HTTP probe behavior with the actual image curl
        # Host CI has Node, not app node_modules; the fixture uses only builtins.
        run: node --experimental-strip-types tests/integration/lavalink-health.ts orbit:lavalink-ci
      - name: Verify plugins, backend WebSocket and readiness without Discord/provider access
        run: |
          cleanup_backend() {
            status=$?
            trap - EXIT
            docker logs orbit-lavalink-ci > "$RUNNER_TEMP/lavalink-startup.log" 2>&1 || true
            cat "$RUNNER_TEMP/lavalink-startup.log"
            if [ "$status" != 0 ]; then
              python3 - <<'PYTHON'
          import os
          from pathlib import Path
          text = Path(os.environ["RUNNER_TEMP"], "lavalink-startup.log").read_text(errors="replace")[-18000:]
          for index, offset in enumerate(range(0, len(text), 3000), 1):
              escaped = text[offset:offset + 3000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Music startup log {index}::{escaped}")
          PYTHON
            fi
            docker rm -f orbit-lavalink-ci || true
            exit "$status"
          }
          trap cleanup_backend EXIT
          docker run -d --name orbit-lavalink-ci --network none --memory 768m \
            -e _JAVA_OPTIONS=-Xmx512M -e LAVALINK_SERVER_PASSWORD=ci-only-lavalink-password \
            -v "$PWD/docker/lavalink/application.yml:/opt/Lavalink/application.yml:ro" orbit:lavalink-ci
          docker run --rm --network container:orbit-lavalink-ci --entrypoint node orbit:ci-dev --import tsx --input-type=module -e '
            import assert from "node:assert/strict";
            import fs from "node:fs";
            import { setTimeout } from "node:timers/promises";
            import { Connector } from "shoukaku";
            import { MusicBackend } from "/app/apps/bot/src/features/music/backend.ts";
            process.on("uncaughtException", error => {
              const detail = String(error.stack ?? error).replaceAll("%", "%25").replaceAll("\r", "%0D").replaceAll("\n", "%0A");
              console.error(`::error title=Music backend smoke test failed::${detail}`);
              process.exit(1);
            });
            // Start the actual application connection controller while Java may
            // still be booting. This transport has NO Discord login/gateway.
            class OfflineConnector extends Connector {
              listen(nodes) { queueMicrotask(() => this.ready(nodes)); }
              getId() { return "120000000000000001"; }
              sendPacket() { throw Error("CI must never send Discord voice packets"); }
            }
            const backend = new MusicBackend(new OfflineConnector(null), [{
              name: "main", url: "127.0.0.1:2333", auth: "ci-only-lavalink-password",
            }], { resume: true, restTimeout: 5 }, { retryDelayMs: 250, maxRetryDelayMs: 1000 });
            let lastSocketError;
            backend.on("error", (_name, error) => { lastSocketError = error.message; });
            const connected = new Promise(resolve => backend.once("ready", resolve));
            let info, lastError;
            for (let attempt = 0; attempt < 90; attempt++) {
              try {
                const response = await fetch("http://127.0.0.1:2333/v4/info", {
                  headers: { Authorization: "ci-only-lavalink-password" },
                  signal: AbortSignal.timeout(2000),
                });
                if (!response.ok) throw Error(`Backend HTTP ${response.status}`);
                info = await response.json();
                break;
              } catch (error) {
                lastError = error;
                await setTimeout(1000);
              }
            }
            assert.ok(info, `Backend failed to start: ${lastError?.message}`);
            assert.equal(info.version.semver, "4.2.2");
            assert.equal(info.lavaplayer, "2.2.6");
            assert.equal(info.plugins.find(plugin => plugin.name === "soundy")?.version, "1.1.0");
            assert.equal(info.sourceManagers.filter(source => source === "soundcloud").length, 1);
            const expected = JSON.parse(fs.readFileSync("/app/docker/lavalink/plugins.lock.json", "utf8")).plugins;
            assert.equal(info.plugins.length, expected.length + 1);
            assert.equal(new Set(info.plugins.map(plugin => plugin.name)).size, info.plugins.length);
            for (const plugin of expected) assert.equal(info.plugins.find(actual => actual.name === plugin.id)?.version, plugin.version, plugin.id);
            assert.deepEqual([...info.sourceManagers].sort(), ["bandcamp", "ocremix", "soundcloud", "youtube"]);
            for (const filter of ["high-pass", "low-pass", "normalization", "echo"]) assert.ok(info.filters.includes(filter), filter);
            assert.ok(!info.filters.includes("lowPass"), "No duplicate built-in low-pass filter");
            // This headless process has no Discord socket keeping it alive.
            // Retry timers are deliberately unrefed: keep the readiness deadline
            // referenced or Node can exit 13 between REST-ready and the next retry.
            const deadline = new AbortController();
            try {
              await Promise.race([
                connected,
                setTimeout(10000, undefined, { signal: deadline.signal }).then(() => { throw Error(`Backend WebSocket not ready: ${lastSocketError}`); }),
              ]);
            } finally {
              deadline.abort();
            }
            assert.ok(backend.getIdealNode(), "Application connection controller must retain the connected node");
            assert.equal((await backend.getIdealNode().rest.getLavalinkInfo()).version.semver, "4.2.2");
            await setTimeout(300);
            assert.ok(backend.getIdealNode(), "Successful WebSocket must not immediately close after a retry");
            backend.stop();
            console.log("All nine pinned plugins + Soundy registered; supervised WebSocket/REST connected; only approved unique sources/filters active.");
          '
          # Exercise the exact image-side readiness probe, including bad auth.
          docker exec orbit-lavalink-ci /opt/Lavalink/healthcheck/run
          if docker exec -e LAVALINK_SERVER_PASSWORD=ci-only-wrong-password orbit-lavalink-ci /opt/Lavalink/healthcheck/run; then
            echo 'Readiness must fail with an incorrect password.' >&2
            exit 1
          fi
      - name: Open the real Dev Container and verify dashboard HTTP without a second bot
        timeout-minutes: 10
        run: bash .devcontainer/ci-smoke.sh
