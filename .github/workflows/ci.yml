name: Orbit CI
on:
  push:
    branches: [main, "arena/**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: orbit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: orbit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orbit -d orbit_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEMO_MODE: "true"
      TEST_DATABASE_URL: postgres://orbit:test_password@localhost:5432/orbit_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate full-stack development Compose override
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile live --profile music config --quiet
      - run: docker build --target runtime -t orbit:ci .
      - run: docker build --target dev -t orbit:ci-dev .
      - name: Smoke-test unprivileged development image without network access
        run: |
          docker run --rm --network none --entrypoint sh orbit:ci-dev -c '
            node -e "const fs=require(\"node:fs\"); if(process.getuid()===0) throw Error(\"Development must not run as root\"); for(const p of [\"/app/.data\",\"/app/apps/web/.next\",\"/app/node_modules\"]) fs.accessSync(p,fs.constants.W_OK)" &&
            npm run roles:export -- --help &&
            npm run music:doctor -- --help
          '
