x-app: &app
  build:
    context: .
    target: runtime
  image: orbit-community:local
  env_file:
    - path: .env
      required: false
  environment: &app-env
    NODE_ENV: production
    DEMO_MODE: ${DEMO_MODE:-true}
    DATABASE_URL: postgres://orbit:${POSTGRES_PASSWORD:-orbit_dev_password}@postgres:5432/orbit
    REDIS_URL: redis://redis:6379
    APP_URL: ${APP_URL:-http://localhost:3000}
    # Keep optional music disabled unless credentials are configured.
    LAVALINK_URL: ${LAVALINK_PASSWORD:+lavalink:2333}
    LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:-}
    DEMO_DATA_PATH: /app/.data/demo.json
  init: true
  restart: unless-stopped
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  web:
    <<: *app
    ports:
      - "3000:3000"
    volumes:
      - demo_data:/app/.data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  migrate:
    <<: *app
    profiles: [live]
    command: ["node", "dist/migrate.js"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    <<: *app
    profiles: [live]
    command: ["node", "dist/bot.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *app
    profiles: [live]
    command: ["node", "dist/worker.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orbit_dev_password}
      POSTGRES_DB: orbit
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Do not reuse the original starter's PostgreSQL 18 volume/layout.
      - orbit_pgdata_v17:/var/lib/postgresql/data
    healthcheck:
      # Check authenticated TCP access, not the temporary init-only Unix socket.
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$$POSTGRES_PASSWORD" PGCONNECT_TIMEOUT=3
          psql --host=127.0.0.1 --username="$$POSTGRES_USER"
          --dbname="$$POSTGRES_DB" --no-password --tuples-only --no-align
          --command="SELECT 1" > /dev/null
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  lavalink:
    build:
      context: .
      dockerfile: docker/lavalink/Dockerfile
    image: orbit-lavalink:local
    profiles: [music]
    environment:
      _JAVA_OPTIONS: -Xmx512M
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_PASSWORD:-change-this-lavalink-password}
    volumes:
      - ./docker/lavalink/application.yml:/opt/Lavalink/application.yml:ro
    # Host-run development bots need this; never bind the audio API publicly.
    ports:
      - "127.0.0.1:2333:2333"
    restart: unless-stopped
    mem_limit: 768m

volumes:
  orbit_pgdata_v17:
  redisdata:
  demo_data:
