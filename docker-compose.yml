services:
  bot:
    image: discordjs-starter
    build:
      context: .
      target: runtime
    container_name: discordjs-starter
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/bot
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 20s
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  dev:
    profiles: [dev]
    image: discordjs-starter:dev
    build:
      context: .
      target: dev
    volumes:
      # The whole repository, not just src: eslint, vitest, drizzle, and tsup
      # read their configs from the root, and db:generate writes to ./drizzle.
      - .:/app
      # Keeps the Linux node_modules from the image instead of an empty folder
      # created by the bind mount (or the host's, which may be a different OS).
      - dev_node_modules:/app/node_modules
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "false"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/bot
      # Tests get their own database; see vitest.config.mts.
      TEST_DATABASE_URL: postgres://postgres:postgres@postgres:5432/bot_test
    ports:
      # Only needed for `docker compose run --service-ports dev npm run db:studio`.
      - "127.0.0.1:4983:4983"
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    stop_grace_period: 10s
    develop:
      watch:
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bot
    ports:
      # Loopback only: containers reach Postgres over the compose network, so
      # a VPS never exposes the database to the internet.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  dev_node_modules:
