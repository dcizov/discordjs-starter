services:
  bot:
    image: discordjs-starter
    build:
      context: .
      target: runtime
    container_name: discordjs-starter
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/bot
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 20s
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  dev:
    profiles: [dev]
    image: discordjs-starter:dev
    build:
      context: .
      target: dev
    volumes:
      - ./src:/app/src
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "false"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/bot
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    stop_grace_period: 10s
    develop:
      watch:
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
