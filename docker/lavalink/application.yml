server:
  port: 2333
  address: 0.0.0.0
lavalink:
  server:
    password: ${LAVALINK_SERVER_PASSWORD}
    sources:
      youtube: false
      bandcamp: true
      # Soundy handles current AAC/fMP4 streams. Never register both loaders.
      soundcloud: false
      twitch: false
      vimeo: false
      nico: false
      http: false
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    playerUpdateInterval: 5
logging:
  level:
    root: INFO
    lavalink: INFO

# Built into the pinned local image; no plugin download at startup.
plugins:
  soundy:
    enabled: true
